[project]
name = "arm-control"
version = "0.2.0"
description = "Learning-project robot arm library (2023): URDF parsing, FK, Jacobian / optimization IK, GJK collision"
readme = "README.md"
authors = [{ name = "Junhan Hu" }]
requires-python = ">=3.10"
dependencies = ["numpy", "sympy", "scipy", "loguru"]

[project.optional-dependencies]
viz = ["matplotlib", "trimesh"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arm_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
